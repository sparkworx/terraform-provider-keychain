name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    if: false  # Disabled - remove this line to enable
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build ARM64
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build \
            -ldflags="-X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/terraform-provider-keychain_v${{ steps.version.outputs.VERSION }}_darwin_arm64

      - name: Build AMD64
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build \
            -ldflags="-X main.version=${{ steps.version.outputs.VERSION }}" \
            -o dist/terraform-provider-keychain_v${{ steps.version.outputs.VERSION }}_darwin_amd64

      - name: Create checksums
        run: |
          cd dist
          shasum -a 256 * > terraform-provider-keychain_${{ steps.version.outputs.VERSION }}_SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/terraform-provider-keychain_v${{ steps.version.outputs.VERSION }}_darwin_arm64
            dist/terraform-provider-keychain_v${{ steps.version.outputs.VERSION }}_darwin_amd64
            dist/terraform-provider-keychain_${{ steps.version.outputs.VERSION }}_SHA256SUMS
