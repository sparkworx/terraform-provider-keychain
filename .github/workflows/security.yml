name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security:
    if: false  # Disabled - remove this line to enable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install security tools
        run: |
          brew install gosec govulncheck gitleaks trivy

      - name: Run tests
        run: go test ./...

      - name: Run gosec
        run: gosec -exclude-dir=testdata -exclude-generated -fmt=text ./...

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run gitleaks
        run: gitleaks detect --source . --verbose

      - name: Run trivy
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL .
